services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cloud_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cloud_demo
      DB_USER: postgres
      DB_PASSWORD: postgres

    depends_on:
      - postgres